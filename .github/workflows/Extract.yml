name: Flatten ModTemplate into repo root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ModTemplate 7z ONLY
        run: |
          set -euo pipefail

          ARCHIVE_NAME="ModTemplate.7z"

          if [ ! -f "$ARCHIVE_NAME" ]; then
            echo "❌ $ARCHIVE_NAME not found in repo root"
            exit 1
          fi

          echo "✅ Found $ARCHIVE_NAME"

          # Temp directory for safe extraction
          mkdir -p modtemplate_tmp

          # Extract quietly
          7z x "$ARCHIVE_NAME" -omodtemplate_tmp -y > /dev/null

          # Expect exactly one top-level folder
          TOP_DIR=$(find modtemplate_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$TOP_DIR" ]; then
            echo "❌ No top-level folder found inside 7z"
            exit 1
          fi

          echo "📦 Extracting from $TOP_DIR"

          # Move contents only (including dotfiles)
          shopt -s dotglob
          mv "$TOP_DIR"/* .
          shopt -u dotglob

          # Cleanup
          rm -rf modtemplate_tmp
          rm -f "$ARCHIVE_NAME"

          echo "✅ ModTemplate extracted into repo root"

      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract ModTemplate 7z into repo root" || echo "No changes to commit"
          git push
