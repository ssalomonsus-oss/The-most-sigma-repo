name: Flatten ModTemplate into repo root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ModTemplate zip ONLY
        run: |
          set -euo pipefail

          ZIP_NAME="ModTemplate.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "❌ $ZIP_NAME not found in repo root"
            exit 1
          fi

          echo "✅ Found $ZIP_NAME"

          # Create a temp directory to extract safely
          mkdir -p modtemplate_tmp

          unzip -q "$ZIP_NAME" -d modtemplate_tmp

          # Move extracted contents into repo root
          # (assumes zip contains a single top-level folder)
          TOP_DIR=$(find modtemplate_tmp -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$TOP_DIR" ]; then
            echo "❌ No folder found inside zip"
            exit 1
          fi

          echo "📦 Extracting from $TOP_DIR"

          shopt -s dotglob
          mv "$TOP_DIR"/* .
          shopt -u dotglob

          # Cleanup
          rm -rf modtemplate_tmp
          rm -f "$ZIP_NAME"

          echo "✅ ModTemplate extracted into repo root"

      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract ModTemplate zip into repo root" || echo "No changes to commit"
          git push
